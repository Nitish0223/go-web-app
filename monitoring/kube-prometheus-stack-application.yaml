# Argo CD Application: Prometheus + Grafana (kube-prometheus-stack) in the monitoring namespace.
# Prerequisites (applied once with kubectl, see monitoring/):
#   - aws-ebs-csi-driver EKS add-on and the gp3 StorageClass (storageclass-gp3.yaml)
#   - Secret monitoring/grafana-admin with keys admin-user and admin-password (not stored in git)
# Create/update: kubectl apply -f monitoring/kube-prometheus-stack-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.14.1
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # Sends alerts by email through Gmail. The Gmail App Password is in Secret
        # monitoring/alertmanager-gmail (key app-password), created by hand and not stored in git.
        alertmanager:
          enabled: true
          alertmanagerSpec:
            replicas: 1
            retention: 120h
            # Mounted at /etc/alertmanager/secrets/alertmanager-gmail/.
            secrets:
              - alertmanager-gmail
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 1Gi
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {memory: 128Mi}
          config:
            global:
              resolve_timeout: 5m
              smtp_smarthost: smtp.gmail.com:587
              smtp_from: nitishrebel1013@gmail.com
              smtp_auth_username: nitishrebel1013@gmail.com
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-gmail/app-password
              smtp_require_tls: true
            route:
              receiver: email
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                # Always-firing helper alerts and info-level noise go nowhere.
                - receiver: "null"
                  matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
                - receiver: "null"
                  matchers:
                    - severity = "info"
            inhibit_rules:
              # A critical alert hides the matching warning for the same problem.
              - source_matchers: [severity = "critical"]
                target_matchers: [severity =~ "warning|info"]
                equal: [namespace, alertname]
              - source_matchers: [severity = "warning"]
                target_matchers: [severity = "info"]
                equal: [namespace, alertname]
              - source_matchers: [alertname = "InfoInhibitor"]
                target_matchers: [severity = "info"]
                equal: [namespace]
            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: nitishrebel1013@gmail.com
                    send_resolved: true

        # EKS runs these control-plane components itself, so they can't be scraped.
        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        # kube-proxy on EKS only exposes metrics on 127.0.0.1.
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            etcd: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeControllerManager: false
            kubeProxy: false

        prometheusOperator:
          # The webhook needs extra cert-patching Job pods; not worth the pod slots here.
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 192Mi}

        prometheus:
          # Scrape Argo CD and cert-manager, which already expose metrics, for the custom alerts below.
          additionalServiceMonitors:
            - name: argocd-metrics
              selector:
                matchLabels:
                  app.kubernetes.io/name: argocd-metrics
              namespaceSelector:
                matchNames: [argocd]
              endpoints:
                - port: metrics
            - name: cert-manager
              selector:
                matchLabels:
                  app.kubernetes.io/name: cert-manager
                  app.kubernetes.io/component: controller
              namespaceSelector:
                matchNames: [cert-manager]
              endpoints:
                - port: http-metrics
                  # Keep each certificate's own namespace label instead of cert-manager's.
                  honorLabels: true
          prometheusSpec:
            # Pick up ServiceMonitors/PodMonitors/rules from every namespace, not only this release's.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            retention: 7d
            retentionSize: 8GB
            resources:
              requests: {cpu: 100m, memory: 300Mi}
              limits: {memory: 800Mi}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi

        grafana:
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            storageClassName: gp3
            size: 2Gi
          # The EBS volume can attach to one node at a time, so stop the old pod before starting the new one.
          deploymentStrategy:
            type: Recreate
          resources:
            # Grafana 13 grows to ~500Mi once heavy dashboards are opened. Near the limit it stalls,
            # health checks time out and the ingress returns 503, so keep plenty of headroom.
            requests: {cpu: 50m, memory: 384Mi}
            limits: {memory: 768Mi}
          grafana.ini:
            server:
              root_url: https://grafana.myexample.sbs
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.myexample.sbs
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.myexample.sbs
          # Extra dashboards from grafana.com, alongside the Kubernetes dashboards the chart ships.
          dashboardProviders:
            dashboardproviders.yaml:
              apiVersion: 1
              providers:
                - name: grafana-com
                  orgId: 1
                  folder: Ingress
                  type: file
                  disableDeletion: false
                  editable: true
                  options:
                    path: /var/lib/grafana/dashboards/grafana-com
          dashboards:
            grafana-com:
              nginx-ingress-controller:
                gnetId: 9614
                revision: 1
                datasource: Prometheus

        # Alerts for this setup, on top of the chart's built-in Kubernetes rules.
        additionalPrometheusRulesMap:
          custom-rules:
            groups:
              - name: go-web-app
                rules:
                  - alert: GoWebAppDown
                    expr: kube_deployment_status_replicas_available{namespace="default", deployment="go-web-app"} < 1
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: go-web-app has no available pods
                      description: The go-web-app Deployment in namespace default has had 0 available replicas for 2 minutes, so https://app.myexample.sbs is down.
              - name: argocd
                rules:
                  - alert: ArgoCDAppOutOfSync
                    expr: argocd_app_info{sync_status!="Synced"} == 1
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Argo CD app {{ $labels.name }} is {{ $labels.sync_status }}'
                      description: 'Argo CD application {{ $labels.name }} has not matched git for 15 minutes. Check the app in https://argocd.myexample.sbs.'
                  - alert: ArgoCDAppUnhealthy
                    expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
                    for: 15m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Argo CD app {{ $labels.name }} is {{ $labels.health_status }}'
                      description: 'Argo CD application {{ $labels.name }} has been {{ $labels.health_status }} for 15 minutes.'
              - name: certificates
                rules:
                  - alert: CertificateExpiringSoon
                    expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
                    for: 1h
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 14 days'
                      description: 'cert-manager normally renews 30 days before expiry, so renewal of {{ $labels.namespace }}/{{ $labels.name }} is failing. Check: kubectl -n {{ $labels.namespace }} describe certificate {{ $labels.name }}'
                  - alert: CertificateNotReady
                    expr: certmanager_certificate_ready_status{condition="False"} == 1
                    for: 30m
                    labels:
                      severity: warning
                    annotations:
                      summary: 'Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready'
                      description: 'cert-manager has not been able to issue {{ $labels.namespace }}/{{ $labels.name }} for 30 minutes.'

        kube-state-metrics:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}

        prometheus-node-exporter:
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart's CRDs are too large for client-side apply's last-applied annotation.
      - ServerSideApply=true
