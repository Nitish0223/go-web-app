# gp3 EBS volumes via the aws-ebs-csi-driver EKS add-on. The cluster's built-in gp2 class uses
# the removed in-tree provisioner, so PVCs must name this class explicitly.
# Apply: kubectl apply -f monitoring/storageclass-gp3.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
# Create the volume in the AZ of the node the pod lands on.
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Delete
