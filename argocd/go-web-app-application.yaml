# Argo CD Application: deploys helm/go-web-app-chart from main into the default namespace.
# CI commits each new image tag to the chart's values.yaml; Argo CD syncs it automatically.
# Create/update: kubectl apply -f argocd/go-web-app-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-web-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Nitish0223/go-web-app.git
    targetRevision: main
    path: helm/go-web-app-chart
    helm:
      # Must stay "go-web-app": it sets the Deployment's selector labels, which can't change.
      releaseName: go-web-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      # Delete resources that are removed from the chart.
      prune: true
      # Revert manual kubectl changes back to what git says.
      selfHeal: true
