# Argo CD server parameters. TLS is terminated by ingress-nginx (see argocd-server-ingress.yaml),
# so argocd-server serves plain HTTP inside the cluster.
# After changing this file: kubectl apply -f argocd/argocd-cmd-params-cm.yaml
#                           kubectl -n argocd rollout restart deploy/argocd-server
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
